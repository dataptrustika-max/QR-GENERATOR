<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRD - QR Code Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; text-align: center; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
                <i data-lucide="printer" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Cetak QR Karyawan</h1>
            <p class="text-gray-500 text-sm mt-1">Buat QR Code untuk ID Card Karyawan</p>
        </div>

        <div class="space-y-4 no-print">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ID Karyawan / Nama</label>
                <input type="text" id="employee-id" placeholder="Contoh: RUSTIC0020" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors uppercase"
                    onkeypress="handleKeyPress(event)">
            </div>
            
            <button onclick="generateQR()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-md active:scale-95 transition-transform">
                <i data-lucide="qr-code" class="w-5 h-5"></i> Buat QR Code
            </button>
        </div>

        <!-- Area Hasil yang akan di-print -->
        <div id="print-area" class="mt-8 hidden flex-col items-center justify-center p-6 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50">
            <h2 class="text-lg font-bold text-gray-800 mb-4 uppercase tracking-wider">ID CARD ABSENSI</h2>
            <img id="qr-image" src="" alt="QR Code" class="w-48 h-48 bg-white p-2 rounded-lg shadow-sm border">
            <p id="qr-text-display" class="mt-4 text-xl font-bold text-blue-700"></p>
            <p class="text-xs text-gray-400 mt-2">Gunakan QR ini untuk Absensi Pintar</p>
            
            <div class="no-print mt-6 flex gap-3">
                <button onclick="downloadQR()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-6 rounded-lg transition-colors flex items-center gap-2 shadow-md active:scale-95 transition-transform">
                    <i data-lucide="download" class="w-4 h-4"></i> Unduh QR
                </button>
                <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-6 rounded-lg transition-colors flex items-center gap-2 shadow-md active:scale-95 transition-transform">
                    <i data-lucide="printer" class="w-4 h-4"></i> Cetak ID
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                generateQR();
            }
        }

        function generateQR() {
            const empId = document.getElementById('employee-id').value.trim().toUpperCase();
            if (!empId) {
                alert("Silakan masukkan ID Karyawan atau Nama terlebih dahulu!");
                return;
            }

            // Menggunakan API gratis dari goqr.me / qrserver untuk generate QR image
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(empId)}`;
            
            document.getElementById('qr-image').src = qrUrl;
            document.getElementById('qr-text-display').textContent = empId;
            document.getElementById('print-area').classList.remove('hidden');
            document.getElementById('print-area').classList.add('flex');
        }

        // Fungsi Baru untuk Mengunduh QR Code
        async function downloadQR() {
            const img = document.getElementById('qr-image');
            const empId = document.getElementById('qr-text-display').textContent;
            
            if (!img.src) return;

            try {
                // Mengambil gambar secara diam-diam agar bisa langsung di-download
                const response = await fetch(img.src);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                // Nama file akan otomatis menjadi: QR_Absensi_RUSTIC0020.png
                a.download = `QR_Absensi_${empId}.png`; 
                
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                alert('Gagal mengunduh gambar. Silakan coba lagi.');
                console.error('Error downloading QR:', error);
            }
        }
    </script>
</body>
</html>
